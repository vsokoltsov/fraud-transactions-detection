version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - STORAGE=csv
      - MODEL=xgboost
      - VERSION=v2
      - STORAGE_PATH=/app/data/transactions.csv
      - FEATURES_PATH=/app/data/interim/features_v2.yaml
      - MODELS_PATH=/app/data/models
      - THRESHOLDS_PATH=/app/data/models/thresholds.yaml
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - STORAGE=csv
      - MODEL=xgboost
      - VERSION=v2
      - STORAGE_PATH=/app/data/transactions.csv
      - FEATURES_PATH=/app/data/interim/features_v2.yaml
      - MODELS_PATH=/app/data/models
      - THRESHOLDS_PATH=/app/data/models/thresholds.yaml
    volumes:
      - ./data:/app/data:ro
    command: ["uv", "run", "pytest", "tests/", "--cov=api"]

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      target: ml
    container_name: ml-notebooks
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      - NB_UID=${NB_UID}
      - NB_GID=${NB_GID}
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - JUPYTER_ENABLE_LAB=yes
      - PLOMBER_DISABLE_JUPYTER=1
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./src:/app/src
    command:
      - uv
      - run
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.root_dir=/app/notebooks
      - --ServerApp.token=
      - --ServerApp.password=
      - --ServerApp.allow_origin=*
      - --ServerApp.disable_check_xsrf=True
      - --ServerApp.allow_root=True
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    ports:
      - "8888:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=postgres@example.com
      - PGADMIN_DEFAULT_PASSWORD=postgres
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres


  minio:
    restart: always
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio12345
      - MINIO_STORAGE_USE_HTTPS=false
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      - postgres

  minio-setup:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - ./infra/minio/create-bucket.sh:/create-bucket.sh
    entrypoint: /bin/sh
    command: -c "chmod +x /create-bucket.sh && /create-bucket.sh"
    restart: "on-failure"

  mlflow:
    build:
      context: .
      dockerfile: infra/mlflow/Dockerfile
    depends_on: [postgres, minio]
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://postgres:postgres@postgres:5432/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://postgres:postgres@postgres:5432/mlflow
      --artifacts-destination s3://mlflow-artifacts
      --host 0.0.0.0 --port 5000
      --allowed-hosts="*"
      --cors-allowed-origins="*"
    ports:
      - "5500:5000"

volumes:
  pg_data:
  minio_data:
  pgadmin-data:
    